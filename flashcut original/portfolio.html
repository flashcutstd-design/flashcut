<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio – FlashCut</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>⚡</text></svg>" />
  <meta name="description" content="Browse the FlashCut portfolio — brand films, creator reels, events and more, all edited in under 10 minutes." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body.portfolio-page {
      background: #0a0505;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── PAGE WRAPPER ── */
    .port-page {
      padding-top: var(--nav-h, 72px);
      padding-bottom: calc(var(--mobile-nav-h, 64px) + 24px);
      background: radial-gradient(ellipse 90% 60% at 50% 20%, #2a0808 0%, #0a0505 65%);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .port-header {
      text-align: center;
      padding: 56px 24px 40px;
    }
    .port-header .eyebrow {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #d4a017;
      margin-bottom: 14px;
      display: block;
    }
    .port-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 5vw, 4rem);
      font-weight: 700;
      color: #f0f0f0;
      line-height: 1.1;
      margin-bottom: 16px;
    }
    .port-header h1 span { color: #d4a017; }
    .port-header p {
      color: rgba(240,240,240,0.5);
      font-size: 1rem;
      max-width: 460px;
      margin: 0 auto;
      line-height: 1.7;
    }

    /* ── FEATURED VIDEOS SECTION ── */
    .featured-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 64px;
    }
    .sec-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #d4a017;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sec-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(212,160,23,0.25);
    }

    /* Three real video cards side by side */
    .featured-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .feat-card {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      aspect-ratio: 9 / 16;
      background: #1a0a0a;
      cursor: pointer;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 1px solid rgba(212,160,23,0.18);
    }
    .feat-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 20px 64px rgba(0,0,0,0.85), 0 0 0 1px rgba(212,160,23,0.4);
    }
    .feat-card video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.35s ease;
    }
    /* Gradient overlay always visible */
    .feat-card__overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.1) 55%, transparent 100%);
      z-index: 2;
      pointer-events: none;
    }
    /* Info bar at bottom */
    .feat-card__info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 18px 18px 16px;
      z-index: 3;
    }
    .feat-card__tag {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #d4a017;
      margin-bottom: 5px;
    }
    .feat-card__title {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 700;
      color: #f0f0f0;
      line-height: 1.3;
    }
    /* Play button center */
    .feat-card__play {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .feat-card:hover .feat-card__play { opacity: 0; }
    .feat-card__play svg {
      width: 56px;
      height: 56px;
      filter: drop-shadow(0 2px 12px rgba(0,0,0,0.8));
    }
    /* Fullscreen btn */
    .feat-card__expand {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 5;
      width: 34px;
      height: 34px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s, background 0.2s;
    }
    .feat-card:hover .feat-card__expand { opacity: 1; }
    .feat-card__expand:hover { background: rgba(212,160,23,0.6); }
    .feat-card__expand svg { width: 16px; height: 16px; stroke: #fff; fill: none; }

    @media (max-width: 900px) {
      .featured-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 560px) {
      .featured-grid { grid-template-columns: 1fr; }
      .feat-card { aspect-ratio: 9 / 14; }
    }

    /* ── REEL CAROUSEL (placeholder cards) ── */
    .carousel-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }
    .reel-wrap {
      position: relative;
      width: 100%;
      padding: 0 50px;
      box-sizing: border-box;
    }
    .reel-track {
      display: flex;
      gap: 14px;
      overflow: hidden;
      width: 100%;
    }
    .reel-card {
      flex: 0 0 200px;
      aspect-ratio: 9 / 16;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      background: #1a0a0a;
      box-shadow: 0 4px 24px rgba(0,0,0,0.55);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .reel-card:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    .reel-card__thumb {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .reel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 38px; height: 38px;
      background: rgba(10,5,5,0.85);
      border: 1px solid rgba(212,160,23,0.4);
      border-radius: 50%;
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
      transition: background 0.2s, transform 0.2s;
      user-select: none;
    }
    .reel-arrow:hover { background: rgba(212,160,23,0.55); transform: translateY(-50%) scale(1.1); }
    .reel-arrow.disabled { opacity: 0.2; pointer-events: none; }
    .reel-arrow--prev { left: 4px; }
    .reel-arrow--next { right: 4px; }
    .reel-counter {
      margin-top: 16px;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.28);
      letter-spacing: 0.1em;
    }
    .reel-counter span { color: #d4a017; font-weight: 700; }

    /* ── LIGHTBOX ── */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lightbox.open { display: flex; }
    .lightbox__inner {
      position: relative;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      aspect-ratio: 9 / 16;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 24px 80px rgba(0,0,0,0.9);
    }
    .lightbox__inner video {
      width: 100%; height: 100%;
      object-fit: contain;
      background: #000;
    }
    .lightbox__close {
      position: absolute;
      top: 16px; right: 16px;
      z-index: 10;
      width: 40px; height: 40px;
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .lightbox__close:hover { background: #d4a017; }
    .lightbox__title {
      position: absolute;
      bottom: 20px;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .reel-wrap { padding: 0 42px; }
      .reel-card { flex: 0 0 52vw; }
      .lightbox__inner { max-width: 100%; border-radius: 12px; }
    }
  </style>
</head>
<body class="portfolio-page">
  <nav class="nav-desktop" id="navbar"></nav>

  <div class="port-page">

    <!-- ── PAGE HEADER ── -->
    <div class="port-header">
      <span class="eyebrow">Our Work</span>
      <h1>The <span>FlashCut</span> Portfolio</h1>
      <p>Every reel shot, edited, and delivered in under 10 minutes. Here's what we've made.</p>
    </div>

    <!-- ── FEATURED REAL VIDEOS (dynamic from /api/portfolio) ── -->
    <div class="featured-section">
      <div class="sec-label">Featured Shoots</div>
      <div class="featured-grid" id="featured-grid">
        <!-- Populated by JS -->
        <div style="grid-column:span 3;text-align:center;color:rgba(240,240,240,0.3);padding:60px">Loading portfolio…</div>
      </div>
    </div>

    <!-- ── MORE WORK CAROUSEL ── -->
    <div class="carousel-section">
      <div class="sec-label">More Work</div>
      <div class="reel-wrap">
        <button class="reel-arrow reel-arrow--prev disabled" id="arrowPrev">&#8249;</button>
        <div class="reel-track" id="reelTrack"></div>
        <button class="reel-arrow reel-arrow--next" id="arrowNext">&#8250;</button>
      </div>
      <div class="reel-counter">
        <span id="cntCur">1</span> – <span id="cntVis">5</span> &nbsp;/&nbsp; <span id="cntTotal">21</span>
      </div>
    </div>

  </div><!-- /port-page -->

  <!-- ── LIGHTBOX ── -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox__inner">
      <button class="lightbox__close" onclick="closeLightbox()">×</button>
      <video id="lightboxVideo" controls autoplay playsinline></video>
      <div class="lightbox__title" id="lightboxTitle"></div>
    </div>
  </div>

  <nav class="nav-mobile"></nav>
  <script src="nav.js"></script>
  <script src="script.js"></script>
<script src="settings.js"></script>
  <script>
    const PLAY_SVG = `<svg viewBox="0 0 52 52" fill="none">
      <circle cx="26" cy="26" r="25" fill="rgba(0,0,0,0.45)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
      <polygon points="21,16 41,26 21,36" fill="#fff"/>
    </svg>`;
    const EXPAND_SVG = `<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="#fff">
      <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
      <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
    </svg>`;

    // ── FEATURED CARDS from /api/portfolio ───────────────
    async function loadPortfolio() {
      const grid = document.getElementById('featured-grid');
      if (!grid) return;
      try {
        const res   = await fetch('/api/portfolio');
        const items = await res.json();

        // Only show items that have a video URL
        const videos = items.filter(item => item.video_url && item.video_url.trim() !== '');

        if (!videos.length) {
          grid.innerHTML = '<p style="color:rgba(240,240,240,0.4);padding:60px 24px;grid-column:span 3;text-align:center">No videos yet. Check back soon!</p>';
          return;
        }

        grid.innerHTML = videos.map((item, i) => {
          const bg = item.thumb_color
            ? `background: linear-gradient(135deg, ${item.thumb_color})`
            : 'background: #1a0a0a';
          return `
          <div class="feat-card" id="fcard-${i}" style="${bg}">
            <video id="fvid-${i}" muted loop playsinline preload="metadata" src="${item.video_url}"></video>
            <div class="feat-card__overlay"></div>
            <div class="feat-card__play">${PLAY_SVG}</div>
            <button class="feat-card__expand" data-src="${item.video_url}" data-title="${item.tag || item.title}" aria-label="Fullscreen">
              ${EXPAND_SVG}
            </button>
            <div class="feat-card__info">
              <div class="feat-card__tag">${item.tag || ''}</div>
              <div class="feat-card__title">${item.title}</div>
            </div>
          </div>`;
        }).join('');

        videos.forEach((_, i) => {
          const card = document.getElementById('fcard-' + i);
          const vid  = document.getElementById('fvid-' + i);
          if (!card || !vid) return;
          card.addEventListener('mouseenter', () => { vid.currentTime = 0; vid.play().catch(() => {}); });
          card.addEventListener('mouseleave', () => { vid.pause(); vid.currentTime = 0; });
          card.addEventListener('click', (e) => {
            if (e.target.closest('.feat-card__expand')) return;
            vid.paused ? vid.play().catch(() => {}) : vid.pause();
          });
          const expBtn = card.querySelector('.feat-card__expand');
          if (expBtn) {
            expBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              openLightbox(expBtn.dataset.src, expBtn.dataset.title);
            });
          }
        });
      } catch(e) { console.warn('Portfolio load failed', e); }
    }

    loadPortfolio();

    // ── LIGHTBOX ─────────────────────────────────────────
    function openLightbox(src, title) {
      const lb    = document.getElementById('lightbox');
      const lbVid = document.getElementById('lightboxVideo');
      const lbTtl = document.getElementById('lightboxTitle');
      lbVid.src   = src;
      lbTtl.textContent = title || '';
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
      lbVid.play().catch(() => {});
    }
    function closeLightbox() {
      const lb    = document.getElementById('lightbox');
      const lbVid = document.getElementById('lightboxVideo');
      lb.classList.remove('open');
      lbVid.pause(); lbVid.src = '';
      document.body.style.overflow = '';
    }
    document.getElementById('lightbox').addEventListener('click', function(e) {
      if (e.target === this) closeLightbox();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    // ── CAROUSEL placeholder cards ────────────────────────
    const GRADIENTS = [
      '#d4a017,#3a2c00', '#603010,#c06020', '#c05000,#800010',
      '#1a0a40,#0a1060', '#400050,#200030', '#800020,#400060',
      '#c00020,#600010', '#205010,#102808', '#900040,#500018',
      '#901010,#400808', '#a05000,#603000', '#800040,#400020',
      '#500080,#200040', '#006030,#003018', '#c04000,#601800',
      '#0a2050,#051030', '#701000,#380800', '#004060,#002030',
      '#602000,#300800', '#300060,#180030', '#005040,#002820'
    ];

    const track     = document.getElementById('reelTrack');
    const arrowPrev = document.getElementById('arrowPrev');
    const arrowNext = document.getElementById('arrowNext');
    const cntCur    = document.getElementById('cntCur');
    const cntVis    = document.getElementById('cntVis');
    const cntTotal  = document.getElementById('cntTotal');

    GRADIENTS.forEach((g, i) => {
      const [c1, c2] = g.split(',');
      const thumbSVG = `data:image/svg+xml,${encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 533"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/></linearGradient></defs><rect width="300" height="533" fill="url(#g)"/><text x="150" y="280" text-anchor="middle" fill="rgba(255,255,255,0.12)" font-size="18" font-family="system-ui">FlashCut</text></svg>`
      )}`;
      const card = document.createElement('div');
      card.className = 'reel-card';
      card.innerHTML = `<img class="reel-card__thumb" src="${thumbSVG}" alt="Reel ${i+1}" loading="lazy">`;
      track.appendChild(card);
    });

    let offset = 0;
    const STEP = 1;
    function cardW()    { const c = track.querySelector('.reel-card'); return c ? c.offsetWidth + 14 : 214; }
    function visCount() { return Math.round(track.offsetWidth / cardW()); }
    function maxOff()   { return Math.max(0, GRADIENTS.length - visCount()); }

    function scrollTo(idx) {
      offset = Math.max(0, Math.min(idx, maxOff()));
      track.style.transform  = `translateX(-${offset * cardW()}px)`;
      track.style.transition = 'transform 0.42s cubic-bezier(0.4,0,0.2,1)';
      arrowPrev.classList.toggle('disabled', offset === 0);
      arrowNext.classList.toggle('disabled', offset >= maxOff());
      const vis = visCount();
      cntCur.textContent   = offset + 1;
      cntVis.textContent   = Math.min(offset + vis, GRADIENTS.length);
      cntTotal.textContent = GRADIENTS.length;
    }

    arrowPrev.addEventListener('click', () => scrollTo(offset - STEP));
    arrowNext.addEventListener('click', () => scrollTo(offset + STEP));

    let tx = 0;
    track.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
    track.addEventListener('touchend',   e => {
      const dx = e.changedTouches[0].clientX - tx;
      if (Math.abs(dx) > 40) scrollTo(dx < 0 ? offset + 1 : offset - 1);
    });

    window.addEventListener('resize', () => scrollTo(offset));
    cntTotal.textContent = GRADIENTS.length;
    scrollTo(0);
  </script>
</body>
</html>
